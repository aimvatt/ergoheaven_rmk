name: Build K04 Custom Touchpad Firmware v3

on:
  push:
    branches: ["k04-touchpad-custom"]
  workflow_dispatch:

jobs:
  build-k04-custom:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply low-latency native-scroll patch
        run: python3 scripts/k04_touchpad_custom_patch_v3.py

      - name: Format patched Rust
        run: |
          cargo fmt --manifest-path keyboards/k04/Cargo.toml
          cargo fmt --manifest-path rmk/Cargo.toml

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabihf clang libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-k04-custom-v3-${{ hashFiles('keyboards/k04/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-k04-
            ${{ runner.os }}-cargo-

      - name: Install flip-link
        run: cargo install flip-link --locked

      - name: Download UF2 converter
        run: |
          curl -fL --retry 5 --retry-delay 5 https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py -o uf2conv.py
          curl -fL --retry 5 --retry-delay 5 https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json -o uf2families.json
          chmod +x uf2conv.py

      - name: Build left / central
        working-directory: keyboards/k04
        env:
          BINDGEN_EXTRA_CLANG_ARGS: "--sysroot=/usr/lib/arm-none-eabi --target=arm-none-eabi -I/usr/lib/arm-none-eabi/include -I/usr/lib/gcc/arm-none-eabi/12.3.1/include"
          KEYBOARD_TOML_PATH: ${{ github.workspace }}/keyboards/k04/keyboard.toml
          RUST_MIN_STACK: "33554432"
          VIAL_JSON_PATH: ${{ github.workspace }}/keyboards/k04/vial.json
        run: cargo build --release --bin central --features production_v22

      - name: Build right / peripheral
        working-directory: keyboards/k04
        env:
          BINDGEN_EXTRA_CLANG_ARGS: "--sysroot=/usr/lib/arm-none-eabi --target=arm-none-eabi -I/usr/lib/arm-none-eabi/include -I/usr/lib/gcc/arm-none-eabi/12.3.1/include"
          KEYBOARD_TOML_PATH: ${{ github.workspace }}/keyboards/k04/keyboard.toml
          RUST_MIN_STACK: "33554432"
          VIAL_JSON_PATH: ${{ github.workspace }}/keyboards/k04/vial.json
        run: cargo build --release --bin peripheral --features production_v22

      - name: Convert firmware to UF2
        working-directory: keyboards/k04
        run: |
          arm-none-eabi-objcopy -O binary target/thumbv7em-none-eabihf/release/central k04_custom_v3_left.bin
          python3 ../../uf2conv.py k04_custom_v3_left.bin --base 0x26000 --family 0xADA52840 --output k04_custom_v3_left.uf2
          arm-none-eabi-objcopy -O binary target/thumbv7em-none-eabihf/release/peripheral k04_custom_v3_right.bin
          python3 ../../uf2conv.py k04_custom_v3_right.bin --base 0x26000 --family 0xADA52840 --output k04_custom_v3_right.uf2

      - name: Upload custom K04 firmware
        uses: actions/upload-artifact@v4
        with:
          name: k04-custom-touchpad-v3
          path: |
            keyboards/k04/k04_custom_v3_left.uf2
            keyboards/k04/k04_custom_v3_right.uf2
          retention-days: 30
